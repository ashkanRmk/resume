cv:
  name: Ashkan Rahmani
  headline: Technical Lead | Senior Software Engineer
  email: ashkan.rmk@gmail.com
  website: https://rahmani.dev
  social_networks:
    - network: LinkedIn
      username: ashkanrmk
    - network: GitHub
      username: ashkanRmk
  sections:
    summary:
      - Innovative and results-driven Technical Lead with 9+ years of experience in software engineering, specializing in backend development, distributed systems, and scalable software architecture.
      - Proven track record of leading high-performing engineering teams, optimizing large-scale systems, and delivering reliable solutions in high-traffic environments.
      - Passionate about *mentorship*, *engineering culture*, and helping developers grow into high-impact software engineers.
    experience:
      - company: Alibaba Travels Co.
        position: Technical Lead
        team: Customer Excellency Team
        start_date: 2025-01
        end_date: present
        location: Remote
        summary: Alibaba is a pioneer and market leader in online travel services and tourism in Iran.
        highlights:
          - Led architecture and delivery of a modular monolith back-office platform, establishing scalable domain boundaries, reusable infrastructure, and shared engineering standards across teams.
          - Re-designed call-center workflows through AI-assisted automation and event-driven processes, contributing to a 40% reduction in operational costs and significantly reducing manual operator involvement.
          - Led development of an AI-powered customer communication platform that automatically classified multilingual customer media/messages, routed requests to the appropriate operational teams, and automated flight/tour change extraction and customer notifications.
          - Built reusable internal platform capabilities for administration, auditing, messaging, authentication, and authorization, accelerating delivery and improving consistency across business domains.
      - company: Alibaba Travels Co.
        position: Technical Lead
        team: Train and Bus Teams
        start_date: 2024-05
        end_date: 2025-01
        location: Remote
        highlights:
          - Addressed historical infrastructure bottlenecks during peak pre-sale periods through deep analysis and targeted optimization.
          - Reduced CPU usage from 31.9 cores to 1.48 cores and RAM usage from 11.8 GiB to 1.85 GiB during peak operations.
          - Improved system stability by resolving critical bottlenecks, enabling seamless pre-sale events.
          - Introduced proactive monitoring jobs to detect booking conflicts, improving booking reliability and reducing customer complaints.
          - Redesigned the ticket issuance funnel to align with the railway provider's updated infrastructure, enabling smoother integration and better delivery.
          - Collaborated with cross-functional teams to deliver changes without service disruption and drive continuous improvement.
      - company: Alibaba Travels Co.
        position: Technical Lead
        team: Bus Team
        start_date: 2023-05
        end_date: 2024-05
        location: Remote
        highlights:
          - Established a new team from scratch, integrating business and technical processes to streamline bus service delivery.
          - Led a cross-functional team of 7 engineers to enhance and maintain Alibaba's bus services.
          - Reduced financial discrepancies by 80% through process improvements and preventive controls.
          - Designed and implemented a rule engine that enabled the marketing team to run campaigns independently.
          - Built partnerships with domestic insurance providers, increasing *revenue* and expanding service offerings.
          - Developed solutions to streamline operations, reduce risk, and optimize performance.
      - company: Alibaba Travels Co.
        position: Senior Software Engineer
        start_date: 2023-03
        end_date: 2023-05
        location: Remote
      - company: TornoGame (E-Sport Platform)
        position: Technical Director
        start_date: 2025-02
        end_date: 2025-11
        location: Remote
        highlights:
          - Led end-to-end delivery of a large-scale esports tournament platform (Call of Duty Mobile, PUBG), from discovery to production launch.
          - Designed system architecture and drove technical decisions for core platform components.
          - Built and led a team of senior engineers to deliver key features including matchmaking, leaderboards, team creation, and tournament engine.
          - Delivered a scalable platform supporting competitive gaming workflows from scratch to production.
      - company: HappyDeveloper
        position: Software Engineering Mentor and Consultant
        start_date: 2021-06
        end_date: present
        summary: Mentorship session feedbacks are available [here](http://rahmani.dev/consult).
        highlights:
          - Created beginner-friendly educational videos for students and professionals starting their programming journey.
          - Taught core software engineering concepts with structured guidance for early-stage learners.
          - Shared practical learning paths to build strong technical foundations.
          - Covered essential soft skills including communication, problem-solving, and long-term career growth.
      - company: PayPing
        position: Back-End Technical Lead
        team: Core Payment Systems
        start_date: 2021-09
        end_date: 2023-03
        location: On-Site
        summary: PayPing is a leading P2P and B2C payment platform serving 200,000+ users, and provides financial infrastructure for platforms and marketplaces in Iran.
        highlights:
          - Led cross-functional engineering initiatives, coordinated front-end and back-end delivery, and mentored developers.
          - Refactored and migrated a legacy core payment system to a scalable, maintainable architecture supporting 3x higher concurrent payment traffic with lower deployment risk.
          - Resolved critical technical debt, transaction inconsistencies, and high-risk bottlenecks across payment and withdrawal workflows, improving reliability and stability.
      - company: PayPing
        position: Software Engineer
        start_date: 2017-10
        end_date: 2021-10
        location: On-Site
        highlights:
          - Migrated a legacy monolithic .NET system to cloud-based microservices, improving scalability, performance, and maintainability.
          - Built and maintained 40+ payment services integrated with major PSPs and Shaparak using .NET, Redis, RabbitMQ, Docker, and Kong API Gateway.

